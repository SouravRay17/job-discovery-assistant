notes_for_llm_resume_tailoring:
  - "This is a single source-of-truth file. When generating a tailored resume, select the positioning_angle that best matches the target job description, then pull only the projects/bullets/skills relevant to that role — do not dump everything."
  - "Always keep the two headline numbers (65% compute-cost reduction, 60%/65% MTTD/MTTR reduction) somewhere near the top — they are the strongest, most differentiated proof points."
  - "For Snowflake/data-platform-heavy JDs, lead with snowflake_platform_admin skills and the snowflake_cost_optimization_agent and customer_360_data_mesh projects."
  - "For GenAI/Agentic AI/LLM JDs, lead with generative_ai_llm skills and the ai_network_incident_orchestrator, genai_schema_validator, and snowflake_cost_optimization_agent (MCP orchestration angle) projects."
  - "For software engineering / ML infra JDs, lead with data_structures_algorithms and ml_infrastructure skills and emphasize code ownership, code reviews, and the CallAI speech-to-text build."
  - "Do not fabricate metrics or tools not listed here. If a target JD requires a skill not in this file, flag it as a gap rather than inventing it."

