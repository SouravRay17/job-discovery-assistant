# Job Discovery & Application Assistant - Configuration

ollama:
  host: "http://localhost:11434"
  model: "llama3.2:3b"  # Change to qwen2.5:14b once pulled

# Google Gemini API (cloud LLM for GitHub Actions)
# Get free API key at: https://aistudio.google.com/apikey
gemini:
  api_key: ""  # Or set GEMINI_API_KEY env var / GitHub Secret
  model: "gemini-3.5-flash"  # Free tier, fast, high quality


scoring:
  threshold: 70  # Jobs below this score (>70% match) are auto-rejected

cv:
  file_path: "d:/Projects/job-discovery-assistant/Sourav_Resume_Latest.docx"

candidate:
  years_of_experience: 3
  target_roles:
    - "Data Engineer"
    - "AI Engineer"
    - "Python Developer"
    - "Backend Engineer"
    - "ML Engineer"
    - "Analytics Engineer"
  target_locations:
    - "Remote"
    - "Bangalore"
    - "India"
  remote_preference: true  # true = prefer remote roles

# Greenhouse boards: use the company's board token
# e.g. "stripe" for https://boards-api.greenhouse.io/v1/boards/stripe/jobs
greenhouse_boards:
  - "stripe"
  - "cloudflare"

# Lever boards: use the company slug
# e.g. "temporal-technologies" for https://api.lever.co/v0/postings/temporal-technologies
lever_boards:
  - "spotify"

# RemoteOK search tags
remoteok:
  tags:
    - "python"
    - "backend"
    - "data"

# Email Notifications Configuration (Gmail SMTP)
email:
  sender_email: "sroy.dgp2014@gmail.com"
  recipient_email: "sroy.dgp2014@gmail.com"
  gmail_app_password: ""  # Generate a 16-character App Password at https://myaccount.google.com/apppasswords
  smtp_server: "smtp.gmail.com"
  smtp_port: 587


