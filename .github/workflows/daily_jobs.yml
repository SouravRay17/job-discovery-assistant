name: Daily Job Discovery & Auto-Tailoring

on:
  schedule:
    # Run daily at 3:30 AM UTC (9:00 AM IST sharp)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  job-discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. Scrape new jobs
      - name: Scrape Jobs
        run: python scraper.py

      # 2. Normalize jobs & extract structured metadata
      - name: Normalize Jobs
        run: python normalizer.py

      # 3. Dense Vector & BM25 Incremental Indexing
      - name: Index Jobs
        run: python indexer.py

      # 4. Hybrid Retrieval (Hard Filters + Vector + BM25 + RRF) -> Top 100
      - name: Retrieve Relevant Jobs
        run: python retriever.py

      # 5. Cross-Encoder Reranking & MMR Diversification -> Top 10-20
      - name: Rerank & Diversify Jobs
        run: python reranker.py

      # 6. Strategic AI Review on Top Picks Only (Gemini AI)
      - name: AI Review (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scorer.py

      # 7. Batch Tailor Resumes & Compile LaTeX PDFs
      - name: Batch Tailor Resumes (Gemini AI + Tectonic)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tailor.py --batch --top 10

      # 8. Send Daily Email Digest with Attachments
      - name: Send Daily Email Digest
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_notifier.py

      # 9. Commit and Push Updated DB, Indices, and Resumes
      - name: Commit and Push Updated DB, Indices, and Resumes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add jobs.db vector_store/ bm25_index/ exports/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto Update: Daily Jobs, Retrieval Indices & Tailored Resumes [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
