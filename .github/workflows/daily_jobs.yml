name: Daily Job Discovery & Auto-Tailoring

on:
  schedule:
    # Run daily at 3:30 AM UTC (9:00 AM IST sharp)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  job-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scraper is run locally to prevent cloud IP blocking. 
      # GitHub Actions starts directly with scoring, tailoring, and email alerts.

      - name: Run Job Fit Scorer (Gemini AI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scorer.py

      - name: Batch Tailor Resume (Gemini AI — skip PDF compilation on Linux)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python batch_tailor.py

      - name: Send Daily Email Digest with PDF Attachments
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_notifier.py

      - name: Commit and Push Updated DB and Resumes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add jobs.db exports/ || true
          git diff-index --quiet HEAD || git commit -m "Auto Update: Daily Jobs & Tailored Resumes [$(date +'%Y-%m-%d')]"
          git push
