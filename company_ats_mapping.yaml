# Company → ATS Platform Mapping
# Each entry maps a company to its ATS platform and the required connection details.
# 
# Supported ATS types: greenhouse, lever, workday, naukri, linkedin, custom
# 
# For 'greenhouse': provide greenhouse_board (the board slug)
# For 'lever': provide lever_slug (the company slug)
# For 'workday': provide workday_url (the full CXS API endpoint)
# For 'custom': provide career_url (the direct careers page URL) — scraped via Naukri/LinkedIn fallback
#
# Companies without a scrapable public API are marked as 'custom' and will be
# covered by Naukri/LinkedIn search aggregation.

companies:

