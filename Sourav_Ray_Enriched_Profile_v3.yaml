- id: customer_360_data_mesh
  name: Customer 360 Data Mesh & Governance – Petabyte-Scale Platform
  role: Architect / Lead Data Modeler
  tech_stack:
  - AWS
  - AWS DMS
  - CDKTF (CDK for Terraform)
  - Terraform
  - GitHub Actions
  - Ephemeral Environments
  - Oracle
  - MySQL
  - MariaDB
  - PostgreSQL
  - CDC (Change Data Capture)
  - Snowflake
  - DBT
  - Python
  - Kinesis
  - Lambda
  - Kinesis Firehose
  - Snowpipe
  - Apache Iceberg
  - S3
  summary: 'Architected a petabyte-scale Customer 360 data platform and data-contract-driven data mesh spanning 1,000+ sources
    across five ingestion patterns, with fault-tolerant streaming validation, Bronze/Silver/Gold data layers, and metadata-driven
    automation for data-contract and DBT artifact generation.

    '
  bullets:
  - 'Architected a petabyte-scale Customer 360 data platform integrating 1,000+ sources across five ingestion patterns: RabbitMQ
    messaging queues, RDBMS databases, flat files, managed APIs, and real-time/event-based systems.'
  - Owned RDBMS ingestion via AWS DMS across multiple source database engines — Oracle, MySQL, MariaDB, and PostgreSQL — designing
    both full-load and CDC (Change Data Capture) replication pipelines for each source.
  - Partitioned large-scale table sets (e.g. ~500 source tables) across multiple parallel DMS full-load and CDC task pairs
    (e.g. 10 full-load + 10 CDC tasks) to parallelize migration and keep individual task scope manageable.
  - 'Designed the full-load-to-CDC handoff: on full-load completion, coordinated with DBAs to capture the LSN (Log Sequence
    Number) marking the exact completion point, then configured each CDC task to resume incremental replication from that
    LSN, ensuring no data gap or duplication between full-load and CDC phases.'
  - Provisioned and managed AWS DMS replication instances, endpoints, and task configurations as Infrastructure-as-Code using
    CDKTF (CDK for Terraform), enabling repeatable, version-controlled environment setup.
  - 'Designed a declarative, config-file-driven source onboarding framework: each new source''s config file specified its
    ingestion type (DMS/RDBMS, messaging queue, flat file, real-time/event stream, or managed API), its data contract, source-to-target
    field mapping (''data coordinates''), and the target Snowflake schema and table name.'
  - Used metadata columns embedded in every ingested record (source schema name, source table name) to trace and map each
    incoming record back to its originating source table without manual lookup, supporting reconciliation and debugging across
    1,000+ sources.
  - Built a GitHub-triggered CI/CD pipeline where committing a new source config file automatically ran CDKTF (cdktf synth
    → cdktf deploy) to generate and deploy the corresponding Terraform-managed infrastructure for that source.
  - 'Validated new source configs and infrastructure changes end-to-end in short-lived, per-PR ephemeral environments before
    merging to production: opened a PR to spin up an ephemeral environment, confirmed the ingestion flow was running correctly
    end-to-end, then raised a separate PR to promote the change into the main pipeline once validated — keeping production
    infrastructure changes safe and reviewable.'
  - 'Designed the end-to-end ingestion architecture: source systems → AWS ingestion services (incl. DMS full load + CDC) →
    Raw Kinesis → Lambda-based data-contract validation → validated Kinesis → Kinesis Firehose → S3 → Snowflake Snowpipe →
    Bronze/Silver/Gold transformation layers.'
  - Built a data-contract-driven validation framework that evaluated incoming records against schema and contract requirements
    before allowing data into the Bronze layer, detecting schema drift, missing mandatory columns, unexpected attributes,
    and invalid/null values for non-optional fields.
  - Implemented fault-tolerant validation and recovery workflows where Lambda processing failures were routed to a messaging
    queue for controlled retry and reprocessing, preventing transient failures from causing data loss and enabling failed
    records to re-enter the validation stream.
  - Led large-scale data modeling and transformation across approximately 100–200 DBT/SQL models spanning Bronze, Silver,
    and Gold layers for cross-domain Customer 360 data.
  - Designed Bronze-layer transformations to flatten complex nested source payloads into downstream-consumable structures
    while preserving validated source data.
  - Developed Silver-layer transformations for deduplication, enrichment, standardization, and business-level data preparation.
  - Built Gold-layer curated data products by joining cross-domain datasets to create trusted Customer 360 views for analytics
    and business consumption.
  - Built a Data Contract Evaluator automation capable of generating contracts for approximately 100 tables within 10 minutes
    with high precision, significantly reducing manual contract-authoring effort.
  - Developed metadata-driven automation to generate Bronze and Silver table definitions and DBT models, accelerating repetitive
    data-model development and contributing to an 80% reduction in development effort.
  - Built multi-stage reconciliation and data-quality evaluation workflows to identify discrepancies, validate data fidelity,
    and support rapid root-cause analysis across the data mesh.
  - Participated in peer reviews, production troubleshooting, failure analysis, and recovery workflows across AWS ingestion,
    data-contract validation, DBT transformations, and Snowflake processing.
  - Incorporated Apache Iceberg tables into the data mesh architecture as part of the open-format storage layer, supporting
    unified data access patterns queryable directly in Snowflake.
  quantified_impact:
  - Petabyte-scale data platform
  - 1,000+ data sources spanning 5 integration patterns
  - Multi-RDBMS ingestion (Oracle, MySQL, MariaDB, PostgreSQL) via AWS DMS full load + CDC
  - ~500 tables partitioned across 10 parallel DMS full-load/CDC task pairs
  - ~100–200 DBT/SQL transformation models
  - 100 data contracts generated in approximately 10 minutes
  - 60% improvement in enterprise data accessibility
  - 80% reduction in data-model development effort
