  thesis:
    title: Multi-output Spatio-Temporal Prediction of Air Pollution using a Transformer Model
    supervisor: Dr. Samarjit Kar, Professor, Dept. of Mathematics, NIT Durgapur
    date: May 2023
    summary: 'Designed an encoder-only Transformer framework (with an unsupervised masked-value pre-training objective) for
      multivariate, multi-output spatio-temporal forecasting of air pollutants (PM2.5, PM10, SO2, NO2) on the Beijing AQI
      public dataset, benchmarked against GRU, LSTM, Bi-LSTM, and CNN baselines.

      '
    key_results:
    - 'Transformer model achieved the best R-squared across all four pollutants (PM2.5: 0.8848, PM10: 0.9564, SO2: 0.9612,
      NO2: 0.9860), outperforming GRU, LSTM, Bi-LSTM, and CNN baselines.'
    - Lowest RMSE/MAE/SAD/MAD among all five models for most pollutants, with statistically significant improvement confirmed
      via t-test on residuals.
    - Performed spatial dependency analysis using Pearson correlation coefficients across 12 Beijing monitoring stations to
      study cross-site pollutant correlation.
    - 'Built full preprocessing pipeline: missing-value handling, outlier detection (Z-score/IQR/Tukey), rolling-window construction,
      and min-max/z-score normalization.'
