    multivariate time-series regression, extending BERT-style masked pre-training to spatio-temporal air-quality data.
  - Built an unsupervised pre-training objective that masks geometric-length segments of each variable and trains the model
    to reconstruct original values, reducing dependency on labeled data.
  - Benchmarked the Transformer against GRU, LSTM, Bi-LSTM, and CNN baselines across four pollutants (PM2.5, PM10, SO2, NO2)
    on the Beijing AQI public dataset, evaluating with RMSE, MAE, MAPE, R-squared, CSI, POD, FAR, and statistical significance
    (t-test).
  - Performed spatial dependency analysis using Pearson correlation coefficients across 12 Beijing monitoring stations to
    quantify cross-site pollutant relationships.
  - 'Built the full data pipeline: cleaning, missing-value handling, outlier detection (Z-score/IQR/Tukey''s method), rolling-window
    construction, and min-max/z-score normalization using pandas and scikit-learn.'
  quantified_impact:
  - Best R-squared among 5 benchmarked models on all 4 pollutants (up to 0.986 on NO2)
  - Statistically significant improvement over GRU/LSTM/Bi-LSTM/CNN (t-test on residuals)
  - Spatial correlation analysis across 12 Beijing air-quality monitoring stations
