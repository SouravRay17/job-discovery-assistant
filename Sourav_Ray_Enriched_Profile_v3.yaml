notes_for_llm_resume_tailoring:
- This is a single source-of-truth file. When generating a tailored resume, select the positioning_angle that best matches
  the target job description, then pull only the projects/bullets/skills relevant to that role — do not dump everything.
- Always keep the two headline numbers (65% compute-cost reduction, 60%/65% MTTD/MTTR reduction) somewhere near the top —
  they are the strongest, most differentiated proof points.
- For Snowflake/data-platform-heavy JDs, lead with snowflake_platform_admin skills and the snowflake_cost_optimization_agent
  and customer_360_data_mesh projects.
- For GenAI/Agentic AI/LLM JDs, lead with generative_ai_llm skills and the ai_network_incident_orchestrator, genai_schema_validator,
  and snowflake_cost_optimization_agent (MCP orchestration angle) projects.
- For software engineering / ML infra JDs, lead with data_structures_algorithms and ml_infrastructure skills and emphasize
  code ownership, code reviews, and the CallAI speech-to-text build.
- Do not fabricate metrics or tools not listed here. If a target JD requires a skill not in this file, flag it as a gap rather
  than inventing it.
- For JDs emphasizing classical ML/DL, statistics, or research depth (e.g. 'regression, classification, feature engineering,
  experimentation'), lead with the deep_learning_time_series skills and the mtech_thesis_transformer_air_quality project —
  this directly evidences hands-on TensorFlow/Keras model-building, evaluation-metric rigor, and academic research ability
  that the GenAI-only projects don't cover.
- For AI Engineer/LLM/RAG JDs asking specifically for reranking, use the Job Discovery & Application Assistant project to
  evidence hands-on Cross-Encoder reranking, RRF, MMR, and IR evaluation.
- Do not describe the Job Discovery & Application Assistant as Factspan employment experience unless an employment relationship
  for that project is independently true. It may be described as an independent production-grade GitHub project.
- For recruiter questionnaires, distinguish professional experience from hands-on independent project experience for LangGraph,
  reranking, fine-tuning, or other skills.
- For retrieval-heavy JDs, emphasize Dense Retrieval, BM25, RRF, Cross-Encoder Reranking, MMR, vector search, and IR evaluation
  metrics.
