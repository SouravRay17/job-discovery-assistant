- id: job_discovery_retrieval_reranking_engine
  name: Job Discovery & Application Assistant — Retrieval-First AI Engine
  role: Creator / AI Engineer (Independent Production-Grade Project)
  context: Independent personal project maintained as a production-grade GitHub repository; not presented as Factspan employment
    experience.
  tech_stack:
  - Python
  - LLM
  - Google Gemini
  - Ollama
  - Sentence Transformers
  - Dense Vector Retrieval
  - BM25
  - RRF
  - Cross-Encoder Reranking
  - MMR
  - ChromaDB
  - SQLite
  - Streamlit
  - GitHub Actions
  - LaTeX
  - Tectonic
  - Gmail
  - WhatsApp
  summary: Built a local-first, cloud-ready retrieval-first AI platform that ingests public job openings, performs deterministic
    filtering and hybrid retrieval, applies Cross-Encoder reranking and MMR diversification, runs bounded LLM strategic review,
    and automates tailored resume generation and notifications.
  bullets:
  - Built a modular Python pipeline for job discovery, normalization, hybrid retrieval, reranking, LLM review, resume tailoring,
    and notification delivery.
  - Implemented high-recall hybrid retrieval using dense sentence embeddings and BM25, fused with Reciprocal Rank Fusion (RRF),
    producing a Top-100 candidate set.
  - Implemented Cross-Encoder reranking with ms-marco-MiniLM-L-6-v2 to perform pairwise relevance scoring and refine the Top-100
    set to the Top-20.
  - Applied Maximal Marginal Relevance (MMR) and company-level caps to diversify the final Top-10–15 recommendations and reduce
    result clustering.
  - Built an information-retrieval evaluation suite using Recall@100, Recall@20, NDCG@10, NDCG@20, Precision@10, and MRR against
    ground-truth relevance labels.
  - Designed a bounded LLM review stage that evaluates only the final candidate set, reducing LLM calls from O(N) to O(K)
    while preserving deterministic retrieval and ranking as the backbone.
  - Implemented LLM-powered candidate-job fit analysis using skills, experience, seniority, and location constraints with
    structured strengths and missing-requirement reasoning.
  - Built automated ATS-oriented resume and cover-letter tailoring with fabrication-safe constraints, followed by LaTeX/Tectonic
    PDF generation.
  - Developed a Streamlit dashboard for retrieval-funnel inspection, score breakdowns, application tracking, and interactive
    1–5 relevance labeling for continuous ranking evaluation.
  - Automated daily execution with GitHub Actions, including ingestion, indexing, retrieval, Cross-Encoder reranking, MMR
    diversification, Gemini review, PDF generation, and notification delivery.
  quantified_impact:
  - Top 100 candidates after hybrid retrieval
  - Top 20 after Cross-Encoder reranking
  - Top 10–15 after MMR diversification
  - IR evaluation with Recall@K, Precision@K, NDCG@K, and MRR
  - Daily end-to-end automated pipeline via GitHub Actions
